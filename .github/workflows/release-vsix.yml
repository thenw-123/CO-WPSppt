# CO-WPSppt: push tag v* → build VSIX → GitHub Release with attachment
name: Release VSIX (CO-WPSppt)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install and pack
        run: |
          npm ci
          npm run vscode:package

      - name: List VSIX
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: Get-ChildItem -Path extension -Filter *.vsix | ForEach-Object { $_.FullName }

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: extension/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
